name: Release

# Every push to the default branch: test, bump the patch version, commit + tag it,
# then build the release image, push it to GHCR and publish a GitHub Release.
# Run it by hand (Actions -> Release -> Run workflow) to bump minor or major instead.
# Note: GitHub skips the run if the pushed head commit's message contains a
# "skip ci" marker in square brackets anywhere, including its body.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time; a second push waits instead of racing for the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # push the version commit + tag, create the release
  packages: write   # push to ghcr.io

jobs:
  version:
    name: Test and bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: End-to-end tests (mock upstream + official SDK)
        run: |
          pip install --quiet anthropic httpx
          cargo build --locked
          python tests/e2e/run.py target/debug/claude-key-router

      - name: Bump version
        id: bump
        run: |
          version=$(python scripts/bump_version.py "${{ inputs.bump || 'patch' }}")
          cargo update --workspace
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      # [skip ci] keeps the version commit from starting another release.
      # --atomic: the commit and the tag land together or not at all (fails if the
      # branch moved during the run; just re-run the workflow).
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"

  # Separate job so "Re-run failed jobs" retries the image/release without bumping again.
  image:
    name: Build image and release
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same build (served from the cache above), exporting only the binary.
      - name: Extract release binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          outputs: type=local,dest=dist
          cache-from: type=gha

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="claude-key-router-v${VERSION}-linux-x86_64"
          mkdir -p "release/$name"
          cp dist/claude-key-router README.md config.example.toml "release/$name/"
          chmod +x "release/$name/claude-key-router"
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && sha256sum "$name.tar.gz" > SHA256SUMS)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          gh release create "v$VERSION" "release/$name.tar.gz" release/SHA256SUMS \
            --verify-tag --title "v$VERSION" --generate-notes \
            --notes "Docker image: \`docker pull $image\`"
