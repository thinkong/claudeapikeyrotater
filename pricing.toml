# Claude API (first-party) prices in USD per million tokens.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (fetched 2026-10-17).
#
# This file is compiled into the binary as the default. To change prices without
# rebuilding, copy it, edit it, and point `pricing_file` in config.toml at the copy.
# Entries in the override file replace built-in entries with the same model id.
#
# Model ids match exactly, or with a date suffix (`claude-opus-4-5-20251101`) or `-latest`.
# Per-model fields:
#   input, output              base price per MTok
#   cache_read_mult            cache hit price as a multiple of input   (default 0.1)
#   cache_write_5m_mult        5-minute cache write multiple of input   (default 1.25)
#   cache_write_1h_mult        1-hour cache write multiple of input     (default 2.0)
#   fast_input, fast_output    `speed: "fast"` prices (cache multipliers apply on top)
#   [models."x".long_context]  threshold (prompt tokens incl. cache), input, output

web_search_per_1k_usd = 10.0
batch_multiplier = 0.5
us_geo_multiplier = 1.1

[models."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_read_mult = 0.025

