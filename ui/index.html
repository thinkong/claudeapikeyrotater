<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Router</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a64; --line: #e4e1da;
  --accent: #c2562f; --accent-ink: #ffffff; --ok: #2f7d4f; --warn: #a86b12; --bad: #b3372b; --off: #8a867e;
  --ok-bg: #e5f2ea; --warn-bg: #f7ecd9; --bad-bg: #f6e1de; --off-bg: #ecebe7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s-other: #a9a59d;
  --grid: #eeece7;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #1f1e1c; --ink: #ecebe7; --muted: #9a968e; --line: #33312d;
    --accent: #e0774f; --accent-ink: #1a0f0a; --ok: #6cc391; --warn: #e2a84e; --bad: #ee7a6c; --off: #8a867e;
    --ok-bg: #1d3327; --warn-bg: #3a2d17; --bad-bg: #3d211d; --off-bg: #2a2926;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s-other: #6d6a64;
    --grid: #2b2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }
header { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
.brand { font-family: var(--mono); font-weight: 650; letter-spacing: -0.02em; font-size: 15px; }
.brand span { color: var(--accent); }
.stats { display: flex; gap: 22px; margin-left: auto; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--mono); font-size: 16px; font-weight: 600; }
.stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
nav { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
nav button { white-space: nowrap; }
nav button { background: none; border: 1px solid transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); }
nav button.on { background: var(--panel); border-color: var(--line); color: var(--ink); font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.bar { display: flex; gap: 10px; align-items: end; padding: 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.bar h2 { margin: 0 auto 0 0; font-size: 15px; align-self: center; }
input[type=text], input[type=password], input[type=number] {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; min-width: 0;
}
input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: progress; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); }
.name { font-weight: 600; }
.hint { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.sub { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.off { color: var(--off); background: var(--off-bg); }
.empty { padding: 36px; text-align: center; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.login { max-width: 380px; margin: 14vh auto; padding: 26px; }
.login h1 { font-family: var(--mono); font-size: 18px; margin: 0 0 6px; }
.login p { color: var(--muted); margin: 0 0 18px; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.err { color: var(--bad); font-size: 13px; min-height: 1.2em; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 22px; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
dialog h3 { margin: 0 0 6px; font-size: 16px; }
dialog p { color: var(--muted); margin: 0 0 14px; }
dialog form { display: flex; flex-direction: column; gap: 12px; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.secret { font-family: var(--mono); font-size: 13px; background: var(--bg); border: 1px dashed var(--accent); border-radius: 8px; padding: 12px; word-break: break-all; user-select: all; }
pre.snip { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0; }
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: 380px; box-shadow: 0 6px 24px rgb(0 0 0 / .18); font-size: 13px; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 14px; }
.mode { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; cursor: pointer; }
.mode:hover { border-color: var(--muted); }
.mode.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.mode input { margin-top: 3px; accent-color: var(--accent); }
.mode b { display: block; }
.fields { display: grid; gap: 12px; padding: 14px; }
.fields label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.fields .row { display: flex; gap: 8px; justify-content: flex-end; }
select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
.dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.dash .wide { grid-column: 1 / -1; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.kpi b { font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 12.5px; color: var(--muted); }
.kpi .delta strong { color: var(--ink); font-weight: 600; }
.kpi svg { margin-top: 8px; display: block; }
.chart { padding: 6px 14px 12px; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart text { fill: var(--muted); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px 0; font-size: 12.5px; }
.legend:empty { display: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.note { padding: 0 14px 12px; }
.fold { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.fold .chev { color: var(--muted); transition: transform .15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(90deg); }
.panel:has(> .tablewrap[hidden]) > .bar { border-bottom: 0; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgb(0 0 0 / .14); min-width: 170px; display: none; }
#tip .t { font-weight: 600; margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 8px; }
#tip .r span { flex: 1; color: var(--muted); max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tip .r b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .r.tot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
#tip i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
#tip i.ln { height: 2px; width: 12px; border-radius: 1px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 700px) {
  .wrap { padding: 0 16px 40px; }
  .stats { margin-left: 0; gap: 16px; }
  .bar label { flex: 1 1 140px; }
  .bar input { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toasts"></div>
<div id="tip"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (v, d = 4) => v == null ? "—" : "$" + Number(v).toFixed(d);
const int = (v) => v == null ? "—" : Number(v).toLocaleString();
const ago = (ms) => {
  if (!ms) return "never";
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const when = (ms) => {
  if (!ms) return "—";
  const d = new Date(ms), today = new Date();
  const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === today.toDateString() ? t : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + t;
};
const span = (a, b) => {
  const s = Math.max(0, Math.round(((b ?? Date.now()) - a) / 1000));
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m";
  if (s < 86400) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
};
const dur = (s) => s < 60 ? s + "s" : s < 3600 ? Math.ceil(s / 60) + "m" : (s / 3600).toFixed(1) + "h";

function store(k, v) { try { v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }

let token = load("ckr_admin");
let tab = load("ckr_tab") || "keys";
let state = { keys: [], clients: [], requests: [], usage: [] };
let timer = null;
let busy = 0; // actions in flight; table refresh waits for them

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "x-api-key": token, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (r.status === 401) { logout("Session expired — enter the admin token again."); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error(data?.error?.message || ("HTTP " + r.status));
  return data;
}

function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "bad" ? 7000 : 4000);
}

function checkToast(name, c) {
  if (!c) return;
  toast(`${name}: ${c.message}${c.error_message ? " — " + c.error_message : ""}`, c.ok ? "ok" : "bad");
}

// ------------------------------------------------------------- login

function renderLogin(err = "") {
  clearInterval(timer);
  $("#app").innerHTML = `
    <div class="panel login">
      <h1>key<span style="color:var(--accent)">/</span>router</h1>
      <p>Enter the admin token. It is in your config (<span class="mono">admin_token</span>) or was printed to the log on first start.</p>
      <form id="loginForm">
        <input type="password" id="tok" placeholder="Admin token" autocomplete="current-password" required>
        <button class="btn primary">Sign in</button>
        <div class="err">${esc(err)}</div>
      </form>
    </div>`;
  $("#tok").focus();
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    token = $("#tok").value.trim();
    try {
      const r = await fetch("/proxy/status", { headers: { "x-api-key": token } });
      if (!r.ok) throw new Error();
      store("ckr_admin", token);
      start();
    } catch (_) { renderLogin("That token was not accepted."); }
  };
}

function logout(msg) { token = null; store("ckr_admin"); renderLogin(msg || ""); }

// ------------------------------------------------------------- shell

function start() {
  $("#app").innerHTML = `
    <header>
      <div class="brand">key<span>/</span>router <small class="hint" id="ver"></small></div>
      <div class="stats" id="stats"></div>
      <button class="btn sm" id="logout">Sign out</button>
    </header>
    <nav id="tabs">
      <button data-t="dashboard">Dashboard</button>
      <button data-t="keys">Upstream keys</button>
      <button data-t="clients">Client keys</button>
      <button data-t="headers">Headers</button>
      <button data-t="activity">Activity</button>
    </nav>
    <main id="view"></main>`;
  // (the skeleton for the current tab is built on first render)
  $("#logout").onclick = () => logout();
  $("#tabs").onclick = (e) => { const t = e.target.dataset.t; if (t) { tab = t; store("ckr_tab", t); renderView(); refresh(); } };
  refresh();
  clearInterval(timer);
  timer = setInterval(() => { if (!busy && !$("#dlg").open && document.visibilityState === "visible") refresh(); }, 5000);
}

async function refresh() {
  try {
    const st = await api("GET", "/proxy/status");
    state.keys = st.keys; state.clients = st.clients; state.status = st;
    if (tab === "headers") state.headers = await api("GET", "/proxy/admin/headers");
    if (tab === "dashboard") await loadDashboard();
    if (tab === "activity") {
      const [req, use, per] = await Promise.all([
        api("GET", "/proxy/admin/requests?limit=60"),
        api("GET", "/proxy/usage?group_by=model"),
        api("GET", "/proxy/admin/credit-periods?limit=300"),
      ]);
      state.requests = req; state.usage = use.rows; state.periods = per;
    }
    renderStats(); renderView();
  } catch (e) { if (e.message !== "unauthorized") toast("Refresh failed: " + e.message, "bad"); }
}

function renderStats() {
  if (state.status?.version) $("#ver").textContent = "v" + state.status.version;
  const k = state.keys, avail = k.filter((x) => x.available).length;
  const spend = k.reduce((a, x) => a + x.spend_usd, 0);
  const remain = k.filter((x) => x.estimated_remaining_usd != null).reduce((a, x) => a + x.estimated_remaining_usd, 0);
  const hasRemain = k.some((x) => x.estimated_remaining_usd != null);
  $("#stats").innerHTML = `
    <div class="stat"><b>${avail}/${k.length}</b><small>keys available</small></div>
    <div class="stat"><b>${usd(spend, 2)}</b><small>tracked spend</small></div>
    <div class="stat"><b>${hasRemain ? usd(remain, 2) : "—"}</b><small>est. credit left</small></div>
    <div class="stat"><b>${state.clients.length}</b><small>clients</small></div>`;
}

// Each tab has a static skeleton (forms) built once, and a table refreshed in place,
// so the 5-second refresh never disturbs what you are typing.
function renderView() {
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.t === tab);
  const view = $("#view");
  if (view.dataset.tab !== tab) {
    view.dataset.tab = tab;
    if (tab === "dashboard") dashSkeleton(); else if (tab === "keys") keysSkeleton(); else if (tab === "clients") clientsSkeleton(); else if (tab === "headers") headersSkeleton(); else view.innerHTML = "";
  }
  if (tab === "dashboard") renderDashboard();
  else if (tab === "keys") $("#keyTable").innerHTML = keysTable();
  else if (tab === "clients") $("#clientTable").innerHTML = clientsTable();
  else if (tab === "headers") renderHeaders();
  else renderActivity();
}

// ------------------------------------------------------------- dashboard

const SPLITS = { model: "Model", key: "Upstream key", client: "Client" };
const SLOTS = 8;
const dash = { days: Number(load("ckr_dash_days")) || 30, split: load("ckr_dash_split") || "model", rows: null, hover: false, pending: false };
if (![7, 30, 90].includes(dash.days)) dash.days = 30;
if (!SPLITS[dash.split]) dash.split = "model";
const colorMaps = {}; // split -> Map(entity -> slot): a series keeps its color across refreshes and filters

const pad2 = (n) => String(n).padStart(2, "0");
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dayLabel = (k, long) => new Date(k + "T00:00:00").toLocaleDateString([], long ? { weekday: "short", month: "short", day: "numeric" } : { month: "short", day: "numeric" });
const compact = (v) => {
  const a = Math.abs(v);
  if (a >= 1e9) return +(v / 1e9).toFixed(a >= 1e10 ? 0 : 1) + "B";
  if (a >= 1e6) return +(v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
  if (a >= 1e3) return +(v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "k";
  return String(Math.round(v * 100) / 100);
};
const money = (v) => v >= 1000 ? "$" + compact(v) : v >= 100 ? "$" + v.toFixed(0) : v >= 1 ? "$" + v.toFixed(2) : v === 0 ? "$0" : "$" + v.toFixed(v < 0.01 ? 4 : 3);
// Axis labels: exactly as many decimals as the tick step needs, so ticks never round into each other.
const stepDecimals = (step) => { let d = 0; while (d < 8 && Math.abs(step * 10 ** d - Math.round(step * 10 ** d)) > 1e-9) d++; return d; };
const moneyAxis = (v, step) => v >= 1000 ? money(v) : "$" + v.toFixed(stepDecimals(step));
const trimZeros = (t) => t.replace(/(\.\d*?)0+(?=\D*$)/, "$1").replace(/\.(?=\D*$)/, "");
const pct = (v) => v == null || !isFinite(v) ? "—" : (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";

function dashRange() {
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (dash.days - 1));
  const days = [];
  for (const d = new Date(start); days.length < dash.days; d.setDate(d.getDate() + 1)) days.push(dayKey(d));
  return { start, days };
}

async function loadDashboard() {
  const { start } = dashRange();
  const split = dash.split, days = dash.days, want = `${split}/${days}/${dayKey(start)}`;
  if (dash.rows && dash.loaded === want && Date.now() - dash.loadedAt < 30000) return; // the aggregate is cheap, but not free
  dash.loaded = want; dash.loadedAt = Date.now();
  const q = `group_by=day&split=${split}&since=${Math.floor(start.getTime() / 1000)}&tz_offset_min=${-new Date().getTimezoneOffset()}`;
  const r = await api("GET", "/proxy/usage?" + q);
  if (split !== dash.split || days !== dash.days) return; // controls changed while loading
  dash.rows = r.rows; dash.rowsSplit = split;
}

function dashSkeleton() {
  dash.hover = dash.pending = false; $("#tip").style.display = "none"; // a chart removed mid-hover never gets pointerleave
  $("#view").innerHTML = `
    <div class="panel" style="margin-bottom:18px">
      <div class="bar" style="align-items:center">
        <h2>Daily usage</h2>
        <div class="seg" id="dRange">${[7, 30, 90].map((n) => `<button data-n="${n}">${n} days</button>`).join("")}</div>
        <label style="flex-direction:row;align-items:center;gap:8px">Split cost by <select id="dSplit">${Object.entries(SPLITS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
      </div>
    </div>
    <div class="kpis" id="dKpis"></div>
    <div class="dash">
      <div class="panel wide"><div class="bar"><h2>Cost per day</h2><span class="sub" id="dCostSub"></span></div><div class="legend" id="dCostLegend"></div><div class="chart" id="dCost"></div><div class="note sub" id="dUnpriced"></div></div>
      <div class="panel"><div class="bar"><h2>Requests per day</h2></div><div class="legend" id="dReqLegend"></div><div class="chart" id="dReq"></div></div>
      <div class="panel"><div class="bar"><h2>Tokens per day</h2></div><div class="legend" id="dTokLegend"></div><div class="chart" id="dTok"></div></div>
      <div class="panel"><div class="bar"><h2>Cache hit rate</h2><span class="sub">cache reads ÷ all input tokens</span></div><div class="chart" id="dHit"></div></div>
      <div class="panel"><div class="bar"><h2>Error rate</h2><span class="sub">responses with status ≥ 400</span></div><div class="chart" id="dErr"></div></div>
      <div class="panel wide"><div class="bar"><h2>Day by day</h2><span class="sub">change is against the day before</span></div><div class="tablewrap" id="dTable"></div></div>
    </div>`;
  $("#dRange").onclick = (e) => {
    const n = Number(e.target.dataset.n); if (!n || n === dash.days) return;
    dash.days = n; store("ckr_dash_days", String(n)); syncDashControls(); refresh();
  };
  $("#dSplit").onchange = (e) => { dash.split = e.target.value; store("ckr_dash_split", dash.split); refresh(); };
  syncDashControls();
}

function syncDashControls() {
  for (const b of document.querySelectorAll("#dRange button")) b.classList.toggle("on", Number(b.dataset.n) === dash.days);
  $("#dSplit").value = dash.split;
}

// Rows (day x entity) -> per-day totals and per-entity cost series, zero-filling idle days.
function dashModel() {
  const { days } = dashRange();
  const idx = new Map(days.map((d, i) => [d, i]));
  const tot = days.map(() => ({ requests: 0, errors: 0, cost: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0, unpriced: 0 }));
  const ent = new Map();
  const split = dash.rowsSplit;
  for (const r of dash.rows || []) {
    const i = idx.get(r.day); if (i == null) continue;
    const t = tot[i];
    t.requests += r.requests; t.errors += r.errors; t.cost += r.cost_usd; t.unpriced += r.unpriced_requests;
    t.input += r.input_tokens; t.output += r.output_tokens; t.cacheRead += r.cache_read_input_tokens;
    t.cacheWrite += r.cache_write_5m_input_tokens + r.cache_write_1h_input_tokens;
    const name = r[split] || (split === "model" ? "(no model)" : split === "key" ? "(no key)" : "(none)");
    if (!ent.has(name)) ent.set(name, days.map(() => 0));
    ent.get(name)[i] += r.cost_usd;
  }
  // Stable colors: an entity keeps its slot once it has one. Past 8 entities, the
  // biggest 7 keep their own color and the rest fold into "Other".
  const map = colorMaps[split] ||= new Map();
  const ranked = [...ent].map(([name, v]) => ({ name, v, sum: v.reduce((a, x) => a + x, 0) })).filter((e) => e.sum > 0).sort((a, b) => b.sum - a.sum);
  const room = ranked.length > SLOTS ? SLOTS - 1 : SLOTS;
  const series = [], rest = [];
  for (const e of ranked) {
    if (series.length >= room) { rest.push(e); continue; }
    if (!map.has(e.name)) {
      const used = new Set(series.map((s) => s.slot).concat([...map.values()]));
      let s = 1; while (s <= room && used.has(s)) s++;
      if (s > room) { // all slots taken by entities not in view: recycle one of those
        const inView = new Set(ranked.map((x) => x.name));
        for (const [k, v] of map) if (!inView.has(k) && v <= room) { map.delete(k); s = v; break; }
      }
      if (s > room) { rest.push(e); continue; }
      map.set(e.name, s);
    }
    const slot = map.get(e.name);
    if (slot > room) { rest.push(e); continue; }
    series.push({ label: e.name, slot, color: `var(--s${slot})`, values: e.v, sum: e.sum });
  }
  if (rest.length) series.push({ label: `Other (${rest.length})`, color: "var(--s-other)", values: days.map((_, i) => rest.reduce((a, e) => a + e.v[i], 0)), sum: rest.reduce((a, e) => a + e.sum, 0) });
  return { days, tot, series };
}

function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  // steps chosen so a quarter of each is still a round tick value
  return [1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10].find((s) => f <= s + 1e-9) * p;
}

// One chart on one y-scale: stacked bars and/or lines over the day axis, with hover.
function drawChart(el, { days, bars = [], lines = [], fmt, axisFmt, integer = false, height = 210, max, tipRows }) {
  const W = Math.max(260, el.clientWidth - 28), H = height, L = 46, R = 6, T = 8, B = 22;
  const n = days.length, band = (W - L - R) / n;
  const stackTop = days.map((_, i) => bars.reduce((a, s) => a + s.values[i], 0));
  const lineMax = Math.max(0, ...lines.flatMap((s) => s.values.filter((v) => v != null)));
  let ymax = max ?? niceMax(Math.max(...stackTop, lineMax));
  if (integer) { ymax = Math.max(4, ymax); if (ymax % 4) ymax = Math.ceil(ymax / 4) * 4; } // whole-number ticks for counts
  const y = (v) => T + (H - T - B) * (1 - v / ymax);
  const x0 = (i) => L + i * band;
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = ymax * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${k ? "var(--grid)" : "var(--line)"}" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${yy + 3.5}" text-anchor="end">${esc(trimZeros((axisFmt || fmt)(v, ymax / 4)))}</text>`;
  }
  const every = Math.ceil(n / Math.max(2, Math.floor((W - L) / 64)));
  days.forEach((d, i) => {
    if ((n - 1 - i) % every === 0) g += `<text x="${x0(i) + band / 2}" y="${H - 6}" text-anchor="middle">${esc(i === n - 1 ? "Today" : dayLabel(d))}</text>`;
  });
  const bw = Math.max(2, Math.min(28, band * 0.68)), gap = band < 6 ? 1 : 2;
  days.forEach((_, i) => {
    const live = bars.filter((s) => s.values[i] > 0);
    const op = i === n - 1 ? ' fill-opacity="0.5"' : ""; // today is still filling up
    let acc = 0;
    live.forEach((s, j) => {
      const v = s.values[i], top = y(acc + v), bot = y(acc) - (j ? gap : 0);
      acc += v;
      const h = bot - top, xx = x0(i) + (band - bw) / 2;
      if (h <= 0.3) return;
      if (j === live.length - 1) {
        const r = Math.min(4, bw / 2, h);
        g += `<path d="M${xx},${bot} V${top + r} Q${xx},${top} ${xx + r},${top} H${xx + bw - r} Q${xx + bw},${top} ${xx + bw},${top + r} V${bot} Z" fill="${s.color}"${op}/>`;
      } else g += `<rect x="${xx}" y="${top}" width="${bw}" height="${h}" fill="${s.color}"${op}/>`;
    });
  });
  for (const s of lines) {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${(x0(i) + band / 2).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // lone points (a day with neighbours missing) would be invisible as a path
    s.values.forEach((v, i) => { if (v != null && s.values[i - 1] == null && s.values[i + 1] == null) g += `<circle cx="${x0(i) + band / 2}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`; });
  }
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2" visibility="hidden"/><g class="dots"></g>`;
  if (bars.length) g += `<rect class="hl" x="0" y="${T}" width="${band}" height="${H - T - B}" fill="var(--ink)" fill-opacity="0.05" visibility="hidden"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}</svg>`;
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), dots = svg.querySelector(".dots"), hl = svg.querySelector(".hl");
  const hide = () => {
    $("#tip").style.display = "none"; xh.setAttribute("visibility", "hidden"); dots.innerHTML = ""; hl?.setAttribute("visibility", "hidden");
    dash.hover = false;
    if (dash.pending) { dash.pending = false; renderDashboard(); }
  };
  svg.onpointerleave = hide;
  svg.onpointermove = (e) => {
    const rect = svg.getBoundingClientRect(), px = (e.clientX - rect.left) * (W / rect.width);
    const i = Math.floor((px - L) / band);
    if (i < 0 || i >= n) return hide();
    dash.hover = true;
    const cx = x0(i) + band / 2;
    if (hl) { hl.setAttribute("x", x0(i)); hl.setAttribute("visibility", "visible"); }
    if (lines.length) {
      xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("visibility", "visible");
      dots.innerHTML = lines.filter((s) => s.values[i] != null).map((s) => `<circle cx="${cx}" cy="${y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`).join("");
    }
    const tip = $("#tip");
    tip.innerHTML = `<div class="t">${esc(dayLabel(days[i], true))}${i === n - 1 ? " · so far" : ""}</div>` + tipRows(i);
    tip.style.display = "block";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = e.clientX + 14;
    if (tx + tw > innerWidth - 8) tx = e.clientX - tw - 14;
    tip.style.left = Math.max(8, tx) + "px";
    tip.style.top = Math.min(innerHeight - th - 8, Math.max(8, e.clientY - th / 2)) + "px";
  };
}

const tipRow = (color, label, val, line) => `<div class="r">${color ? `<i class="${line ? "ln" : ""}" style="background:${color}"></i>` : `<i></i>`}<span>${esc(label)}</span><b>${esc(val)}</b></div>`;
const tipTotal = (label, val) => `<div class="r tot"><i></i><span>${esc(label)}</span><b>${esc(val)}</b></div>`;
const legend = (items) => items.map((s) => `<span title="${esc(s.label)}"><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("");

function sparkline(values, color) {
  const W = 160, H = 28, max = Math.max(...values, 1e-9), n = values.length;
  const pts = values.map((v, i) => `${((i / Math.max(1, n - 1)) * W).toFixed(1)},${(H - 2 - (H - 4) * (v / max)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function change(cur, prev) {
  if (!prev) return cur ? "new" : "";
  const c = (cur - prev) / prev;
  if (Math.abs(c) < 0.0005) return "no change";
  return (c > 0 ? "▲ +" : "▼ −") + Math.abs(c * 100).toFixed(Math.abs(c) < 0.1 ? 1 : 0) + "%";
}

function renderDashboard() {
  if (!dash.rows || !$("#dKpis")) return;
  if (dash.hover) { dash.pending = true; return; } // don't yank the chart from under the pointer
  const { days, tot, series } = dashModel();
  const n = days.length, Y = n - 2, P = n - 3; // yesterday is the last full day
  const sum = (f) => tot.reduce((a, t) => a + f(t), 0);
  const allIn = (t) => t.input + t.cacheRead + t.cacheWrite;
  const totalCost = sum((t) => t.cost), totalReq = sum((t) => t.requests);
  const hit = sum((t) => t.cacheRead) / (sum(allIn) || NaN), errRate = sum((t) => t.errors) / (totalReq || NaN);
  const kpi = (label, value, sub, spark = "") => `<div class="panel kpi"><small>${label}</small><b>${value}</b><span class="delta">${sub}</span>${spark}</div>`;
  const vs = `vs ${esc(dayLabel(days[P]))}`;
  $("#dKpis").innerHTML =
    kpi("Spend yesterday", money(tot[Y].cost), `<strong>${change(tot[Y].cost, tot[P].cost) || "no change"}</strong> ${vs} · today so far ${money(tot[n - 1].cost)}`, sparkline(tot.map((t) => t.cost), "var(--s1)")) +
    kpi("Requests yesterday", int(tot[Y].requests), `<strong>${change(tot[Y].requests, tot[P].requests) || "no change"}</strong> ${vs} · today so far ${int(tot[n - 1].requests)}`, sparkline(tot.map((t) => t.requests), "var(--s1)")) +
    kpi(`Spend, last ${n} days`, money(totalCost), `about <strong>${money(totalCost / n)}</strong> a day · ${int(totalReq)} requests`) +
    kpi("Cache hit rate", pct(hit), totalReq ? `<strong>${pct(errRate)}</strong> of requests failed over ${n} days` : `no requests in the last ${n} days`);

  $("#dCostSub").textContent = `split by ${SPLITS[dash.rowsSplit].toLowerCase()} · today's bar is partial`;
  $("#dCostLegend").innerHTML = series.length > 1 ? legend(series) : "";
  drawChart($("#dCost"), {
    days, bars: series, fmt: money, axisFmt: moneyAxis, height: 240,
    tipRows: (i) => series.filter((s) => s.values[i] > 0).map((s) => tipRow(s.color, s.label, money(s.values[i]))).join("") + tipTotal("Total", money(tot[i].cost)),
  });
  const unpriced = sum((t) => t.unpriced);
  $("#dUnpriced").textContent = unpriced ? `${int(unpriced)} successful request${unpriced > 1 ? "s" : ""} in this range had no price (model not in the price table) and count as $0 here.` : "";
  $("#dUnpriced").style.display = unpriced ? "" : "none";

  const reqS = [{ label: "Succeeded", color: "var(--s1)", values: tot.map((t) => t.requests - t.errors) }, { label: "Errors (status ≥ 400)", color: "var(--s8)", values: tot.map((t) => t.errors) }];
  $("#dReqLegend").innerHTML = legend(reqS);
  drawChart($("#dReq"), {
    days, bars: reqS, fmt: compact, integer: true,
    tipRows: (i) => tipRow("var(--s1)", "Succeeded", int(reqS[0].values[i])) + tipRow("var(--s8)", "Errors", int(tot[i].errors)) + tipTotal("Total", int(tot[i].requests)),
  });

  const tokS = [
    { label: "Input (uncached)", color: "var(--s1)", values: tot.map((t) => t.input) },
    { label: "Cache read", color: "var(--s3)", values: tot.map((t) => t.cacheRead) },
    { label: "Cache write", color: "var(--s4)", values: tot.map((t) => t.cacheWrite) },
    { label: "Output", color: "var(--s2)", values: tot.map((t) => t.output) },
  ];
  $("#dTokLegend").innerHTML = legend(tokS);
  drawChart($("#dTok"), {
    days, bars: tokS, fmt: compact, integer: true,
    tipRows: (i) => tokS.map((s) => tipRow(s.color, s.label, int(s.values[i]))).join("") + tipTotal("Total", int(allIn(tot[i]) + tot[i].output)),
  });

  const hitV = tot.map((t) => allIn(t) ? t.cacheRead / allIn(t) : null);
  drawChart($("#dHit"), {
    days, lines: [{ color: "var(--s3)", values: hitV }], fmt: (v) => Math.round(v * 100) + "%", max: 1, height: 170,
    tipRows: (i) => tipRow("var(--s3)", "Cache hit", pct(hitV[i]), true) + tipRow("", "Cache read tokens", compact(tot[i].cacheRead)),
  });
  const errV = tot.map((t) => t.requests ? t.errors / t.requests : null);
  drawChart($("#dErr"), {
    days, lines: [{ color: "var(--s8)", values: errV }], fmt: (v) => +(v * 100).toFixed(1) + "%", height: 170,
    max: niceMax(Math.max(0.01, ...errV.filter((v) => v != null))),
    tipRows: (i) => tipRow("var(--s8)", "Error rate", pct(errV[i]), true) + tipRow("", "Errors", `${int(tot[i].errors)} of ${int(tot[i].requests)}`),
  });

  // idle days are left out of the table (the charts show the gaps); change is still against the calendar day before
  const rows = days.map((d, i) => i).filter((i) => tot[i].requests || i === n - 1).reverse().map((i) => {
    const t = tot[i], p = tot[i - 1];
    const cng = (a, b) => i === 0 ? "" : `<div class="sub">${change(a, b)}</div>`;
    return `<tr><td>${esc(dayLabel(days[i], true))}${i === n - 1 ? ` <span class="sub">· so far</span>` : ""}</td>
      <td class="num">${money(t.cost)}${cng(t.cost, p?.cost)}</td>
      <td class="num">${int(t.requests)}${cng(t.requests, p?.requests)}</td>
      <td class="num">${compact(allIn(t))} / ${compact(t.output)}</td>
      <td class="num">${pct(allIn(t) ? t.cacheRead / allIn(t) : null)}</td>
      <td class="num">${int(t.errors)}</td></tr>`;
  }).join("");
  $("#dTable").innerHTML = totalReq ? `<table><thead><tr><th>Day</th><th class="num">Cost</th><th class="num">Requests</th><th class="num">Tokens in / out</th><th class="num">Cache hit</th><th class="num">Errors</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">No traffic in the last ${n} days.</div>`;
}

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (tab === "dashboard") renderDashboard(); }, 150); });

// ------------------------------------------------------------- upstream keys

function fundedLine(k) {
  if (k.state === "out_of_credits" || !k.funded_since_ms) return "";
  if (!(k.funded_reason || "").startsWith("refill")) return "";
  const window = k.refilled_after_ms ? ` · refilled between ${when(k.refilled_after_ms)} and ${when(k.funded_since_ms)}` : "";
  const trial = k.on_probation ? " · waiting for a real request to confirm" : "";
  return `<div class="sub">back since ${when(k.funded_since_ms)}${window}${trial}</div>`;
}

function cycleLeft(k) {
  const left = k.estimated_left_this_cycle_usd;
  if (left == null) return "";
  const tip = `Last cycle this key used ${usd(k.last_cycle_spend_usd, 2)} through this proxy before running out. Assumes the refill was the same size and the key isn't used elsewhere.`;
  return left >= 0
    ? `<div class="sub" title="${esc(tip)}">est. ${usd(left, 2)} left</div>`
    : `<div class="sub" title="${esc(tip)}">${usd(-left, 2)} past last cycle</div>`;
}

function statePill(k) {
  if (k.state === "available") return `<span class="pill ok">Available</span>`;
  if (k.state === "disabled") return `<span class="pill off">Disabled</span>`;
  if (k.state === "out_of_credits") return `<span class="pill bad" title="${esc(k.reason)}">Out of credits · ${k.cooldown_secs > 0 ? "next check in " + dur(k.cooldown_secs) : "checking…"}</span>${k.out_of_credits_since_ms ? `<div class="sub">since ${when(k.out_of_credits_since_ms)}${k.credit_check_interval_secs > (state.status?.cooldowns?.credit_exhausted_secs || Infinity) ? ` · checks slowed to every ${dur(k.credit_check_interval_secs)} (passed a check, then failed real traffic)` : ""}</div>` : ""}`;
  const bad = (k.reason || "").startsWith("authentication");
  return `<span class="pill ${bad ? "bad" : "warn"}" title="${esc(k.reason)}">${bad ? "Invalid key" : esc(k.reason || "Cooling down")} · ${dur(k.cooldown_secs)}</span>`;
}

function keysTable() {
  const rows = state.keys.map((k) => `
    <tr data-name="${esc(k.name)}">
      <td><div class="name">${esc(k.name)}</div><div class="hint">${esc(k.key_hint)}</div></td>
      <td>${statePill(k)}${fundedLine(k)}${k.last_error && k.state === "available" ? `<div class="sub" title="${esc(k.last_error)}">last error: ${esc(k.last_error.slice(0, 40))}</div>` : ""}</td>
      <td class="num">${k.estimated_remaining_usd == null ? `<span class="sub">not set</span>` : usd(k.estimated_remaining_usd, 2)}
        ${k.balance_usd == null ? "" : `<div class="sub">of ${usd(k.balance_usd, 2)} set ${ago(k.balance_set_ms)}</div>`}</td>
      <td class="num">${usd(k.spend_usd)}${k.spend_this_period_usd == null ? "" : `<div class="sub" title="since ${esc(k.funded_reason)} at ${when(k.funded_since_ms)}">${usd(k.spend_this_period_usd)} this cycle</div>`}${cycleLeft(k)}</td>
      <td class="num">${int(k.requests_since_start)}<div class="sub">${ago(k.last_used_ms)}</div></td>
      <td><div class="actions">
        <button class="btn sm" data-act="refresh" title="Clear cooldown and send a 1-token test request">Refresh</button>
        <button class="btn sm" data-act="history">History</button>
        <button class="btn sm" data-act="balance">Balance</button>
        <button class="btn sm" data-act="replace">Replace</button>
        <button class="btn sm" data-act="toggle">${k.enabled ? "Disable" : "Enable"}</button>
        <button class="btn sm danger" data-act="remove">Remove</button>
      </div></td>
    </tr>`).join("");
  return state.keys.length ? `
        <table><thead><tr><th>Key</th><th>Status</th><th class="num">Est. credit left</th><th class="num">Spend</th><th class="num">Requests</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>` : `<div class="empty">No upstream keys yet. Add a Claude API key above.</div>`;
}

function keysSkeleton() {
  $("#view").innerHTML = `
    <div class="panel">
      <form class="bar" id="addKey">
        <h2>Upstream API keys</h2>

        <label style="flex:1 1 260px">Claude API key<input type="password" id="kSecret" placeholder="sk-ant-api03-…" required autocomplete="off"></label>
        <label>Credit balance ($, optional)<input type="number" id="kBal" min="0" step="0.01" placeholder="e.g. 100"></label>

      checkToast(r.name, r.check);
      refresh();
    } catch (err) { toast(err.message, "bad"); } finally { btn.disabled = false; }
  };
  $("#keyTable").addEventListener("click", keyAction);
}

async function keyAction(e) {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const name = btn.closest("tr").dataset.name;
  const k = state.keys.find((x) => x.name === name);
  const path = "/proxy/admin/keys/" + encodeURIComponent(name);
  busy++;
  try {
    switch (btn.dataset.act) {
      case "history":
        await showHistory(name);
        return;
      case "refresh": {
        btn.disabled = true; btn.textContent = "Checking…";
        const r = await api("POST", path + "/refresh");
        checkToast(name, r.check);
        break;
      }
      case "balance": {
        const v = await ask({ title: `Credit balance for ${name}`, text: "Enter the current balance shown in the Claude Console (e.g. after a top-up). Leave empty to stop tracking.", label: "Balance in USD", type: "number", value: k.balance_usd ?? "", allowEmpty: true });
        if (v === null) return;
        await api("PATCH", path, { balance_usd: v === "" ? null : Number(v) });
        toast(`Balance for ${name} recorded.`, "ok");
        break;
      }
      case "replace": {
        const v = await ask({ title: `Replace API key for ${name}`, text: "Paste the new key. History and spend stay with this name; the cooldown is cleared and the new key is checked.", label: "New Claude API key", type: "password" });
        if (!v) return;
        const r = await api("PATCH", path, { key: v.trim() });
        checkToast(name, r.check);
        break;
      }
      case "toggle":
        await api("PATCH", path, { enabled: !k.enabled });
        break;
      case "remove":
        if (!(await confirmBox(`Remove ${name}?`, "The key stops receiving traffic immediately. Files, batches and other resources created with it become unreachable through the proxy. Usage history is kept."))) return;
        await api("DELETE", path);
        toast(`${name} removed.`);
        break;
    }
  } catch (err) { toast(err.message, "bad"); } finally { busy--; }
  refresh();
}

// ------------------------------------------------------------- headers

const H_STATUS = {
  forwarded: ["ok", "Forwarded"],
  protected: ["ok", "Always forwarded"],
  dropped_by_mode: ["off", "Dropped (minimal)"],
  dropped_by_rule: ["warn", "Dropped (rule)"],
  always_removed: ["off", "Always removed"],
};
const H_NOTE = {
  protected: "The API needs this header.",
  always_removed: "Credentials, connection and proxy headers never go upstream.",
};
const hPill = (s) => `<span class="pill ${H_STATUS[s][0]}">${H_STATUS[s][1]}</span>`;
const matches = (p, n) => p.endsWith("*") ? n.startsWith(p.slice(0, -1)) : n === p;
const csv = (v) => v.split(",").map((x) => x.trim().toLowerCase()).filter(Boolean);

function headersSkeleton() {
  $("#view").innerHTML = `
    <div class="grid2">
      <div class="panel">
        <div class="bar"><h2>Header forwarding</h2><span class="sub" id="hSource"></span><button class="btn sm" id="hReset" hidden>Reset to config file</button></div>
        <div class="modes" id="hModes">
          <label class="mode" data-mode="all"><input type="radio" name="hmode" value="all">
            <span><b>Forward all</b><span class="sub">Every client header goes upstream, except credentials and connection headers.</span></span></label>
          <label class="mode" data-mode="minimal"><input type="radio" name="hmode" value="minimal">
            <span><b>Minimal</b><span class="sub">Only what the API reads: <span class="mono">anthropic-*</span> (version, betas, workspace), <span class="mono">content-type</span> and <span class="mono">accept</span>. Client tags such as <span class="mono">user-agent</span> and <span class="mono">x-stainless-*</span> are dropped. Beta flags are all kept.</span></span></label>
        </div>
      </div>
      <div class="panel">
        <div class="bar"><h2>Headers clients sent</h2><span class="sub">since the proxy started · names only, never values</span></div>
        <div class="tablewrap" id="hSeen"></div>
      </div>
      <div class="panel">
        <div class="bar"><h2>Beta flags clients sent</h2><span class="sub">values of <span class="mono">anthropic-beta</span></span></div>
        <div class="tablewrap" id="hBetas"></div>
      </div>
      <div class="panel">
        <div class="bar"><h2>Rules</h2><span class="sub">comma-separated, case-insensitive; a trailing * matches a prefix</span></div>
        <form class="fields" id="hRules">
          <label>Also forward in minimal mode (keep)<input type="text" id="hKeep" placeholder="x-request-tag"></label>
          <label>Drop headers<input type="text" id="hDrop" placeholder="x-stainless-*"></label>
          <label>Drop beta flags<input type="text" id="hDropBetas" placeholder="some-beta-*"></label>
          <div class="row"><button class="btn primary" id="hSave">Save rules</button></div>
        </form>
      </div>
    </div>
    <p class="sub" style="margin-top:12px">Changes apply to the next request; no restart needed. Once saved here, these settings replace the <span class="mono">[headers]</span> section of the config file until you reset them. <span class="mono">anthropic-version</span>, <span class="mono">content-type</span> and <span class="mono">anthropic-workspace-id</span> can't be dropped. Dropping a beta flag that a request's body uses makes the API reject that request.</p>`;
  $("#hModes").onchange = (e) => { if (e.target.name === "hmode") saveHeaders({ ...state.headers.settings, mode: e.target.value }); };
  $("#hReset").onclick = async () => {
    if (!(await confirmBox("Reset header rules?", "The settings from the config file's [headers] section apply again (forward all, if it has none)."))) return;
    busy++;
    try { state.headers = await api("DELETE", "/proxy/admin/headers"); fillRules(); renderHeaders(); toast("Header rules reset.", "ok"); }
    catch (err) { toast(err.message, "bad"); } finally { busy--; }
  };
  $("#hRules").onsubmit = (e) => {
    e.preventDefault();
    saveHeaders({ ...state.headers.settings, keep: csv($("#hKeep").value), drop: csv($("#hDrop").value), drop_betas: csv($("#hDropBetas").value) });
  };
  $("#hSeen").addEventListener("click", headerAction);
  $("#hBetas").addEventListener("click", headerAction);
  rulesFilled = false;
}

let rulesFilled = false;
function fillRules() {
  const s = state.headers.settings;
  $("#hKeep").value = s.keep.join(", ");
  $("#hDrop").value = s.drop.join(", ");
  $("#hDropBetas").value = s.drop_betas.join(", ");
  rulesFilled = true;
}

async function saveHeaders(settings, msg = "Header rules saved.") {
  busy++;
  try { state.headers = await api("PUT", "/proxy/admin/headers", settings); fillRules(); toast(msg, "ok"); }
  catch (err) { toast(err.message, "bad"); } finally { busy--; renderHeaders(); }
}

function renderHeaders() {
  const h = state.headers; if (!h) return;
  if (!rulesFilled) fillRules();
  const s = h.settings;
  $("#hSource").textContent = h.source === "ui" ? "saved in the web UI" : "from the config file";
  $("#hReset").hidden = h.source !== "ui";
  for (const m of document.querySelectorAll("#hModes .mode")) {
    const on = m.dataset.mode === s.mode;
    m.classList.toggle("on", on); m.querySelector("input").checked = on;
  }
  const action = (kind, name, status) => {
    if (status === "protected" || status === "always_removed") return `<span class="sub">${H_NOTE[status]}</span>`;
    const label = status === "forwarded" ? "Drop" : "Forward";
    const rule = (kind === "beta" ? s.drop_betas : s.drop).find((p) => matches(p, name));
    const title = status === "dropped_by_rule" && rule !== name ? `title="Removes the rule ${esc(rule)}, which may cover others too"` : "";
    return `<button class="btn sm" data-kind="${kind}" data-name="${esc(name)}" data-status="${status}" ${title}>${label}</button>`;
  };
  $("#hSeen").innerHTML = h.seen.length ? `
    <table><thead><tr><th>Header</th><th>Last seen</th><th>Status</th><th></th></tr></thead><tbody>
    ${h.seen.map((x) => `<tr><td class="mono">${esc(x.name)}</td><td class="sub">${ago(x.last_seen_ms)}</td><td>${hPill(x.status)}</td><td><div class="actions">${action("header", x.name, x.status)}</div></td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">No requests since the proxy started. Send one through the proxy and its headers show up here.</div>`;
  $("#hBetas").innerHTML = h.betas_seen.length ? `
    <table><thead><tr><th>Beta flag</th><th>Last seen</th><th>Status</th><th></th></tr></thead><tbody>
    ${h.betas_seen.map((x) => `<tr><td class="mono">${esc(x.value)}</td><td class="sub">${ago(x.last_seen_ms)}</td><td>${hPill(x.status)}</td><td><div class="actions">${x.status === "always_removed" ? `<span class="sub">OAuth flags only work with a login token; upstream gets an API key.</span>` : action("beta", x.value, x.status)}</div></td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">No beta flags seen yet.</div>`;
}

function headerAction(e) {
  const btn = e.target.closest("button[data-kind]"); if (!btn) return;
  const { kind, name, status } = btn.dataset;
  const s = state.headers.settings;
  const next = { ...s, keep: [...s.keep], drop: [...s.drop], drop_betas: [...s.drop_betas] };
  const list = kind === "beta" ? next.drop_betas : next.drop;
  if (status === "forwarded") {
    if (kind === "header" && next.mode === "minimal" && next.keep.some((p) => matches(p, name))) next.keep = next.keep.filter((p) => !matches(p, name));
    else list.push(name);
    saveHeaders(next, `${name} will be dropped.`);
  } else if (status === "dropped_by_rule") {
    const kept = list.filter((p) => !matches(p, name));
    if (kind === "beta") next.drop_betas = kept; else next.drop = kept;
    saveHeaders(next, `${name} will be forwarded.`);
  } else if (status === "dropped_by_mode") {
    next.keep.push(name);
    saveHeaders(next, `${name} will be forwarded.`);
  }
}

  const reqRows = state.requests.map((r) => {

      <td><span class="pill ${okStatus ? "ok" : r.status === 429 ? "warn" : "bad"}" title="${esc(r.error ?? "")}">${r.status}</span>${r.attempts > 1 ? `<div class="sub">${r.attempts} attempts</div>` : ""}</td>
      <td class="num">${int(u.input_tokens)} / ${int(u.output_tokens)}<div class="sub">cache ${int(u.cache_read_input_tokens)} read · ${int(u.cache_write_5m_input_tokens + u.cache_write_1h_input_tokens)} write</div></td>
      <td class="num">${r.cost_usd == null ? (r.model && okStatus ? `<span class="sub" title="model not in price table">unpriced</span>` : "—") : usd(r.cost_usd, 5)}</td>
    </tr>`;
  }).join("");
  const useRows = state.usage.map((u) => {
    const inTot = u.input_tokens + u.cache_read_input_tokens + u.cache_write_5m_input_tokens + u.cache_write_1h_input_tokens;

      <td class="num">${int(inTot)}</td><td class="num">${int(u.output_tokens)}</td><td class="num">${hit}%</td><td class="num">${usd(u.cost_usd, u.cost_usd < 1 ? 4 : 2)}</td></tr>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="grid2">
      <div class="panel">
        <div class="bar"><h2>Last 30 days by model</h2></div>
        <div class="tablewrap">${state.usage.length ? `<table><thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Input tokens</th><th class="num">Output tokens</th><th class="num">Cache hit</th><th class="num">Cost</th></tr></thead><tbody>${useRows}</tbody></table>` : `<div class="empty">No traffic yet.</div>`}</div>
      </div>
      <div class="panel" id="creditHist">
        <div class="bar"><h2><button class="fold" data-act="fold" aria-expanded="false"><svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Credit history</button></h2><span class="sub" id="chSummary"></span><button class="btn sm" data-act="all" hidden></button></div>
        <div class="tablewrap"></div>
      </div>
      <div class="panel">
        <div class="bar"><h2>Recent requests</h2></div>
        <div class="tablewrap">${state.requests.length ? `<table><thead><tr><th>When</th><th>Client</th><th>Key</th><th>Request</th><th>Status</th><th class="num">Tokens in / out</th><th class="num">Cost</th></tr></thead><tbody>${reqRows}</tbody></table>` : `<div class="empty">No requests yet.</div>`}</div>
      </div>
    </div>`;
  renderCreditHistory();
  $("#creditHist").onclick = (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const keys = groupPeriods(state.periods || []).filter((g) => g.rows.length > 1).map((g) => g.key);
    if (b.dataset.act === "fold") {
      creditOpen = !creditOpen; store("ckr_credit_open", creditOpen ? "1" : "0");
    } else if (b.dataset.act === "all") {
      const open = keys.some((k) => !expandedKeys.has(k));
      for (const k of keys) open ? expandedKeys.add(k) : expandedKeys.delete(k);
    } else expandedKeys.has(b.dataset.key) ? expandedKeys.delete(b.dataset.key) : expandedKeys.add(b.dataset.key);

  };
}

// ------------------------------------------------------------- credit history

let creditOpen = load("ckr_credit_open") === "1"; // whole panel; starts folded
const expandedKeys = new Set(); // keys whose earlier credit periods are shown; survives the 5 s refresh

function groupPeriods(rows) {
  const by = new Map();
  for (const p of rows) { if (!by.has(p.key)) by.set(p.key, []); by.get(p.key).push(p); } // rows arrive newest first
  return [...by].map(([key, rows]) => ({ key, rows }));
}

function renderCreditHistory() {
  const box = $("#creditHist"); if (!box) return;
  const groups = groupPeriods(state.periods || []);
  const multi = groups.filter((g) => g.rows.length > 1);
  const fold = box.querySelector("button[data-act=fold]");
  fold.setAttribute("aria-expanded", creditOpen);
  const total = groups.reduce((a, g) => a + g.rows.length, 0);
  $("#chSummary").textContent = !total ? "" : creditOpen ? "latest period per key"
    : `${groups.length} key${groups.length > 1 ? "s" : ""} · ${total} period${total > 1 ? "s" : ""} · ${groups.filter((g) => !g.rows[0].ended_ms).length} funded now`;
  box.querySelector(".tablewrap").hidden = !creditOpen;
  const all = box.querySelector("button[data-act=all]");
  all.hidden = !creditOpen || !multi.length;
  all.textContent = multi.some((g) => !expandedKeys.has(g.key)) ? "Expand all" : "Collapse all";
  if (!groups.length) { box.querySelector(".tablewrap").innerHTML = `<div class="empty">No credit history yet.</div>`; return; }
  const body = groups.map(({ key, rows }) => {
    const open = expandedKeys.has(key), earlier = rows.length - 1;
    const done = rows.filter((p) => p.ended_ms && p.end_reason === "out of credits");
    const avg = done.length ? done.reduce((a, p) => a + p.spend_usd, 0) / done.length : null;
    const keyCell = `<td><div class="name">${esc(key)}</div>
      <div class="sub">${rows.length} period${rows.length > 1 ? "s" : ""}${avg != null ? ` · avg ${usd(avg, 2)} per refill` : ""}</div>
      ${earlier ? `<button class="btn sm" data-key="${esc(key)}" data-act="toggle" aria-expanded="${open}" style="margin-top:4px">${open ? "▾ Hide earlier" : `▸ ${earlier} earlier`}</button>` : ""}</td>`;
    return periodRow(rows[0], keyCell) + (open ? rows.slice(1).map((p) => periodRow(p, `<td></td>`, true)).join("") : "");
  }).join("");
  box.querySelector(".tablewrap").innerHTML = `<table><thead><tr><th>Key</th><th>Funded from</th><th>Until</th><th class="num">Lasted</th><th class="num">Used</th><th class="num">Requests</th></tr></thead><tbody>${body}</tbody></table>`;
}

function periodRow(p, firstCell, nested) {
  const refill = (p.start_reason || "").startsWith("refill")
    ? `<div>${when(p.started_ms)}</div><div class="sub">${p.refilled_after_ms ? "refilled after " + when(p.refilled_after_ms) : esc(p.start_reason)}</div>`
    : `<div>${when(p.started_ms)}</div><div class="sub">${esc(p.start_reason)}</div>`;
  const end = p.ended_ms
    ? `<div>${when(p.ended_ms)}</div><div class="sub">${esc(p.end_reason)}</div>`
    : `<span class="pill ok">Funded now</span>`;
  return `<tr${nested ? ' style="background:var(--bg)"' : ""}>${firstCell}<td>${refill}</td><td>${end}</td>
    <td class="num">${span(p.started_ms, p.ended_ms)}</td><td class="num">${usd(p.spend_usd)}</td><td class="num">${int(p.requests)}</td></tr>`;
}

function periodsTable(rows, withKey) {
  if (!rows.length) return `<div class="empty">No credit history yet.</div>`;
  const body = rows.map((p) => periodRow(p, withKey ? `<td class="name">${esc(p.key)}</td>` : "")).join("");
  return `<table><thead><tr>${withKey ? "<th>Key</th>" : ""}<th>Funded from</th><th>Until</th><th class="num">Lasted</th><th class="num">Used</th><th class="num">Requests</th></tr></thead><tbody>${body}</tbody></table>`;
}

async function showHistory(name) {
  const rows = await api("GET", "/proxy/admin/credit-periods?limit=200&key=" + encodeURIComponent(name));
  const done = rows.filter((p) => p.ended_ms && p.end_reason === "out of credits");
  const avg = done.length ? done.reduce((a, p) => a + p.spend_usd, 0) / done.length : null;
  const f = $("#dlgForm");
  f.innerHTML = `
    <h3>Credit history · ${esc(name)}</h3>
    <p>Each row is one funded period: from when the key was added or a refill was detected, until it ran out of credits.
      “Used” is what this proxy spent on the key in that period${avg != null ? ` — on average ${usd(avg, 2)} per refill over ${done.length} completed period${done.length > 1 ? "s" : ""}` : ""}.</p>
    <div class="tablewrap" style="max-height:55vh;overflow:auto">${periodsTable(rows, false)}</div>
    <div class="row"><button class="btn primary" value="ok">Close</button></div>`;
  $("#dlg").style.width = "min(760px, calc(100vw - 32px))";
  $("#dlg").addEventListener("close", () => { $("#dlg").style.width = ""; }, { once: true });
  $("#dlg").showModal();
}

// ------------------------------------------------------------- dialogs

function ask({ title, text, label, type = "text", value = "", allowEmpty = false }) {
  return new Promise((resolve) => {
    const d = $("#dlg"), f = $("#dlgForm");
    f.innerHTML = `
      <h3>${esc(title)}</h3><p>${esc(text)}</p>
      <label class="sub" style="display:flex;flex-direction:column;gap:4px">${esc(label)}
        <input id="askVal" type="${type}" ${type === "number" ? 'min="0" step="0.01"' : ""} ${allowEmpty ? "" : "required"} autocomplete="off" value="${esc(value)}"></label>
      <div class="row"><button type="button" class="btn" id="askCancel">Cancel</button><button class="btn primary" value="ok">Save</button></div>`;
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    $("#askCancel").onclick = () => { finish(null); d.close(); };
    f.onsubmit = () => finish($("#askVal").value);
    d.onclose = () => finish(null);
    d.showModal(); $("#askVal").focus();
  });
}

function confirmBox(title, text) {
  return new Promise((resolve) => {
    const d = $("#dlg"), f = $("#dlgForm");
    f.innerHTML = `<h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="row"><button type="button" class="btn" id="cfNo">Cancel</button><button class="btn primary" value="ok">Confirm</button></div>`;
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    $("#cfNo").onclick = () => { finish(false); d.close(); };
    f.onsubmit = () => finish(true);
    d.onclose = () => finish(false);
    d.showModal();
  });
}

token ? start() : renderLogin();
</script>
